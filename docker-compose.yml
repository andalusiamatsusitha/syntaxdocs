services:
  # 1. MySQL Database Service (Multi-Database: db_cms & db_school)
  mysql:
    image: mysql:8.0
    container_name: syntaxdocs_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_USER: syntax_user
      MYSQL_PASSWORD: syntax_secret_password
    volumes:
      - syntaxdocs_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - syntaxdocs_network

  # 2. PHP 8.2-FPM Backend Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: syntaxdocs_php
    restart: unless-stopped
    working_dir: /var/www/syntaxdocs
    volumes:
      - .:/var/www/syntaxdocs
    depends_on:
      - mysql
    networks:
      - syntaxdocs_network

  # 3. Nginx Web Server (Routes to CDN, CMS, and School)
  nginx:
    image: nginx:alpine
    container_name: syntaxdocs_nginx
    restart: unless-stopped
    ports:
      - "8090:8080"   # Central UI CDN & Showcase
      - "8001:8001"   # CMS Product App
      - "8002:8002"   # School Product App
      - "8003:8003"   # Orbital Ground Station 3D Parallax App
    volumes:
      - .:/var/www/syntaxdocs:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - syntaxdocs_network

volumes:
  syntaxdocs_mysql_data:
    driver: local

networks:
  syntaxdocs_network:
    driver: bridge
