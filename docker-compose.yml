version: '3.8'

services:
  # 1. MySQL Database Service (Multi-Database Support)
  mysql:
    image: mysql:8.0
    container_name: syntax_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_USER: syntax_user
      MYSQL_PASSWORD: syntax_secret_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - syntax_network

  # 2. PHP 8.2-FPM Backend Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: syntax_php
    restart: unless-stopped
    working_dir: /var/www/syntaxdocs
    volumes:
      - .:/var/www/syntaxdocs
    depends_on:
      - mysql
    networks:
      - syntax_network

  # 3. Nginx Web Server (Routes to CDN, CMS, and School)
  nginx:
    image: nginx:alpine
    container_name: syntax_nginx
    restart: unless-stopped
    ports:
      - "8080:8080"   # Central UI CDN & Showcase
      - "8001:8001"   # CMS Product App
      - "8002:8002"   # School Product App
    volumes:
      - .:/var/www/syntaxdocs:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php
    networks:
      - syntax_network

volumes:
  mysql_data:
    driver: local

networks:
  syntax_network:
    driver: bridge
